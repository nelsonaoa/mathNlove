<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛的數學你我他 - 互動數學實驗室</title>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <link rel="apple-touch-icon" href="favicon.jpg">
    <!-- 1. 先引入主站的共用專案樣式表 -->
    <link rel="stylesheet" href="https://nelsonaoa.github.io/project-style.css">
    <!-- 2. 再引入本專案專屬的精簡樣式（覆寫粉紅主題色 + GGB 彈窗） -->
    <link rel="stylesheet" href="style.css">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <!-- 頂部返回導覽列（與其他專案統一） -->
    <div class="top-bar">
        <a href="https://nelsonaoa.github.io/" class="back-btn">← 返回首頁</a>
        <a href="https://www.youtube.com/@loveNmath" target="_blank" class="yt-btn">▶ YouTube 頻道</a>
    </div>

    <!-- 寬版橫幅主視覺（融入圓角卡片風格） -->
    <header class="banner-card">
        <img src="banner-math.jpg" alt="愛的數學你我他 - GeoGebra 互動數學">
    </header>

    <!-- 標籤篩選膠囊列 -->
    <nav class="unit-nav" id="tag-nav">
        <button class="active" data-tag="all">全部標籤</button>
        <button data-tag="圓周率">圓周率</button>
        <button data-tag="幾何與代數">幾何與代數</button>
        <button data-tag="絕對值函數">絕對值函數</button>
        <button data-tag="三角函數">三角函數</button>
        <button data-tag="圓錐曲線">圓錐曲線</button>
        <button data-tag="拋物線">拋物線</button>
        <button data-tag="橢圓">橢圓</button>
        <button data-tag="雙曲線">雙曲線</button>
        <button data-tag="極座標曲線">極座標曲線</button>
        <button data-tag="空間圖形">空間圖形</button>
        <button data-tag="平面向量">平面向量</button>
        <button data-tag="級數">級數</button>
        <button data-tag="統計">統計</button>
        <button data-tag="數學實驗">數學實驗</button>
        <button data-tag="魔術方塊">魔術方塊</button>
        <button data-tag="地球科學">地球科學</button>
        <button data-tag="自製玩具">自製玩具</button>
    </nav>

    <!-- 互動模擬清單（由 catalog.js 自動生成卡片） -->
    <main class="sim-grid" id="sim-grid"></main>

    <!-- 點擊卡片後彈出的 GeoGebra 純互動視窗（無原檔下載鈕） -->
    <div class="modal-overlay" id="ggb-modal">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <div class="modal-tags" id="modal-tags"></div>
                    <h2 id="modal-title">模擬標題</h2>
                </div>
                <button class="close-btn" id="close-modal">✕ 關閉</button>
            </div>
            <!-- 1. GeoGebra 互動畫布區 -->
            <div class="ggb-container">
                <div id="ggb-element"></div>
            </div>

            <!-- 2. YouTube 教學解說影片區 -->
            <div class="modal-video" id="modal-video-box" style="display: none;">
                <div class="video-wrapper">
                    <iframe id="modal-video-frame" src="" title="YouTube 教學影片" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <!-- 3. 教學註解與操作說明區 -->
            <div class="modal-note">
                <h4>📝 教學註解與操作提示</h4>
                <p id="modal-desc"></p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>聯絡開發者：<a href="mailto:NelsonAoA@gmail.com">NelsonAoA@gmail.com</a></p>
        &copy; 2026 愛的數學你我他. All rights reserved.
    </div>

    <!-- 先載入資料庫，再載入互動邏輯 -->
    <script src="catalog.js"></script>
    <script src="app.js"></script>
</body>
</html>
