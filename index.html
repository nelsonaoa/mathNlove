<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛的數學你我他 - 互動數學實驗室</title>
    <!-- 1. 先引入主站的共用專案樣式表 -->
    <link rel="stylesheet" href="https://nelsonaoa.github.io/project-style.css">
    <!-- 2. 再引入本專案專屬的精簡樣式（覆寫粉紅主題色 + GGB 彈窗） -->
    <link rel="stylesheet" href="style.css">
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body>

    <!-- 頂部返回導覽列（與其他專案統一） -->
    <div class="top-bar">
        <a href="https://nelsonaoa.github.io/" class="back-btn">← 返回首頁</a>
        <a href="https://www.youtube.com/@loveNmath" target="_blank" class="yt-btn">▶ YouTube 頻道</a>
    </div>

    <!-- 寬版橫幅主視覺（融入圓角卡片風格） -->
    <header class="banner-card">
        <img src="banner-math.jpg" alt="愛的數學你我他 - GeoGebra 互動數學">
    </header>

    <!-- 標籤篩選膠囊列 -->
    <nav class="unit-nav" id="tag-nav">
        <button class="active" data-tag="all">全部標籤</button>
        <button data-tag="圓周率">圓周率</button>
        <button data-tag="幾何與代數">幾何與代數</button>
        <button data-tag="絕對值函數">絕對值函數</button>
        <button data-tag="三角函數">三角函數</button>
        <button data-tag="圓錐曲線">圓錐曲線</button>
        <button data-tag="圓錐曲線">拋物線</button>
        <button data-tag="圓錐曲線">橢圓</button>
        <button data-tag="圓錐曲線">雙曲線</button>
        <button data-tag="極座標曲線">極座標曲線</button>
        <button data-tag="空間圖形">空間圖形</button>
        <button data-tag="平面向量">平面向量</button>
        <button data-tag="級數">級數</button>
        <button data-tag="統計">統計</button>
        <button data-tag="魔術方塊">魔術方塊</button>
        <button data-tag="自製玩具">自製玩具</button>
    </nav>

    <!-- 互動模擬清單（由 catalog.js 自動生成卡片） -->
    <main class="sim-grid" id="sim-grid"></main>

    <!-- 點擊卡片後彈出的 GeoGebra 純互動視窗（無原檔下載鈕） -->
    <div class="modal-overlay" id="ggb-modal">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <div class="modal-tags" id="modal-tags"></div>
                    <h2 id="modal-title">模擬標題</h2>
                </div>
                <button class="close-btn" id="close-modal">✕ 關閉</button>
            </div>
            <!-- 1. GeoGebra 互動畫布區 -->
            <div class="ggb-container">
                <div id="ggb-element"></div>
            </div>

            <!-- 2. YouTube 教學解說影片區 -->
            <div class="modal-video" id="modal-video-box" style="display: none;">
                <div class="video-wrapper">
                    <iframe id="modal-video-frame" src="" title="YouTube 教學影片" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>

            <!-- 3. 教學註解與操作說明區 -->
            <div class="modal-note">
                <h4>📝 教學註解與操作提示</h4>
                <p id="modal-desc"></p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>聯絡開發者：<a href="mailto:NelsonAoA@gmail.com">NelsonAoA@gmail.com</a></p>
        &copy; 2026 愛的數學你我他. All rights reserved.
    </div>

    <script src="catalog.js"></script>
    <script>
        const simGrid = document.getElementById('sim-grid');
        const tagButtons = document.querySelectorAll('#tag-nav button');
        const modal = document.getElementById('ggb-modal');
        const closeModalBtn = document.getElementById('close-modal');

        // 取得標籤陣列
        function getItemTags(item)
        {
            return Array.isArray(item.tags) ? item.tags : [];
        }

        // 渲染卡片清單
        function renderCards(filterTag = 'all')
        {
            simGrid.innerHTML = '';
            const filtered = filterTag === 'all'
                ? ggbCatalog
                : ggbCatalog.filter(item => getItemTags(item).includes(filterTag));

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'sim-card';
                const tagsHtml = getItemTags(item)
                    .map(tag => `<span class="unit-badge"># ${tag}</span>`)
                    .join('');

                card.innerHTML = `
                    <div>
                        <div class="card-top">${tagsHtml}</div>
                        <h3>${item.title}</h3>
                        <p>${item.note}</p>
                    </div>
                    <div class="card-footer">
                        <span>${item.file ? '開啟互動操作' : '觀看教學影片'}</span>
                        <span class="arrow">→</span>
                    </div>
                `;

                card.addEventListener('click', () => openGgbModal(item));
                simGrid.appendChild(card);
            });
        }

        // 輔助函式：將一般 YouTube 網址轉成 embed 嵌入網址
        function getYoutubeEmbedUrl(url)
        {
            if(!url)
            {
                return '';
            }
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^&?\/]+)/);
            return match ? `https://www.youtube.com/embed/${match[1]}` : url;
        }

        // 開啟 GeoGebra 互動視窗
        function openGgbModal(item)
        {
            const tagsHtml = getItemTags(item)
                .map(tag => `<span class="modal-unit-badge"># ${tag}</span>`)
                .join('');
            document.getElementById('modal-tags').innerHTML = tagsHtml;
            document.getElementById('modal-title').textContent = item.title;
            document.getElementById('modal-desc').innerHTML = item.note;

            const ggbContainer = document.querySelector('.ggb-container');
            const ggbElement = document.getElementById('ggb-element');
            ggbElement.innerHTML = '';

            if(item.file)
            {
                ggbContainer.style.display = 'flex';
                const params = {
                    "appName": "classic",
                    "filename": `files/${item.file}`,
                    "width": item.width || 860,
                    "height": item.height || 520,
                    "showToolBar": false,
                    "showAlgebraInput": false,
                    "showMenuBar": false,
                    "enableRightClick": false,
                    "enableShiftDragZoom": item.allowZoom === true,
                    "showResetIcon": true,
                    "language": "zh-TW"
                };
                const applet = new GGBApplet(params, true);
                applet.inject('ggb-element');
            }
            else
            {
                ggbContainer.style.display = 'none';
            }

            const videoBox = document.getElementById('modal-video-box');
            const videoFrame = document.getElementById('modal-video-frame');
            if(item.youtube)
            {
                videoBox.style.display = 'block';
                videoFrame.src = getYoutubeEmbedUrl(item.youtube);
            }
            else
            {
                videoBox.style.display = 'none';
                videoFrame.src = '';
            }

            modal.classList.add('open');
        }

        function closeGgbModal()
        {
            modal.classList.remove('open');
            document.getElementById('ggb-element').innerHTML = '';
            document.getElementById('modal-video-frame').src = '';
        }

        closeModalBtn.addEventListener('click', closeGgbModal);

        modal.addEventListener('click', (e) => {
            if(e.target === modal)
            {
                closeGgbModal();
            }
        });

        tagButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tagButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderCards(btn.getAttribute('data-tag'));
            });
        });

        renderCards('all');
    </script>
</body>
</html>
